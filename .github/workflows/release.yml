# Builds the extension packages when a v* tag is pushed and attaches them to
# a GitHub release, with the version's CHANGELOG.md section as release notes.
#
# It can also be started by hand (Actions → Release → Run workflow) for an
# existing tag, e.g. one pushed before this workflow existed. Running it again
# for a tag that already has a release replaces the attached files.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.2.2"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: node:22.11.0-alpine3.20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Install build tools
        run: apk add --no-cache bash git zip github-cli

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check version and extract release notes
        run: ./tools/release-notes.sh "$TAG" > /tmp/notes.md

      - name: Build
        run: ./tools/build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file /tmp/notes.md \
              --verify-tag
          fi

  # Submits the version to addons.mozilla.org (listed channel), where Mozilla
  # reviews and signs it. The first submission creates the listing from
  # amo-metadata.json. It does not wait for the review (--approval-timeout=0);
  # Firefox users install and update the add-on from addons.mozilla.org.
  # Needs the repository secrets AMO_JWT_ISSUER and AMO_JWT_SECRET; without
  # them the job is skipped. AMO accepts each version only once, so re-running
  # this job for a version that was already submitted fails.
  amo:
    needs: release
    runs-on: ubuntu-latest
    container: node:22.11.0-alpine3.20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - name: Install build tools
        if: env.WEB_EXT_API_KEY != ''
        run: apk add --no-cache bash git zip

      - uses: actions/checkout@v4
        if: env.WEB_EXT_API_KEY != ''
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Build and unpack the extension
        if: env.WEB_EXT_API_KEY != ''
        run: |
          ./tools/build.sh
          mkdir -p /tmp/ext
          unzip -q dist/*.zip -d /tmp/ext

      - name: Lint with Mozilla's add-on linter
        if: env.WEB_EXT_API_KEY != ''
        run: npx --yes web-ext@10.8.0 lint --source-dir /tmp/ext

      - name: Submit to addons.mozilla.org
        if: env.WEB_EXT_API_KEY != ''
        run: >-
          npx --yes web-ext@10.8.0 sign
          --channel=listed
          --source-dir /tmp/ext
          --amo-metadata amo-metadata.json
          --approval-timeout=0
          --artifacts-dir /tmp/web-ext-artifacts
