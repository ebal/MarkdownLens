# Builds the extension packages when a v* tag is pushed and attaches them to
# a GitHub release, with the version's CHANGELOG.md section as release notes.
#
# It can also be started by hand (Actions → Release → Run workflow) for an
# existing tag, e.g. one pushed before this workflow existed. Running it again
# for a tag that already has a release replaces the attached files.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, e.g. v0.2.2"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    container: node:22.11.0-alpine3.20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Install build tools
        run: apk add --no-cache bash git zip github-cli

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check version and extract release notes
        run: ./tools/release-notes.sh "$TAG" > /tmp/notes.md

      - name: Build
        run: ./tools/build.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file /tmp/notes.md \
              --verify-tag
          fi
